<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>我的食谱本 · 本地单文件（无图版 + 外观可定制）</title>
  <style>
    :root{
      --bg:#f6f7fb; --fg:#1f2d3d; --muted:#5b7083; --card:#ffffff; --accent:#4f7cff;
      --ok:#10b981; --warn:#f59e0b; --danger:#ef4444; --border:#e5e7eb; --shadow:0 6px 20px rgba(0,0,0,.08);
      --app-font: system-ui, -apple-system, Segoe UI, Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }
    [data-theme="dark"]{
      --bg:#0b0e14; --fg:#e5e7eb; --muted:#94a3b8; --card:#121826; --accent:#7aa2ff;
      --ok:#10b981; --warn:#d97706; --danger:#f87171; --border:#1f2937; --shadow:0 8px 30px rgba(0,0,0,.6);
    }
    body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 var(--app-font)}
    .container{max-width:960px;margin:24px auto;padding:0 16px}
    header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px}
    .brand{font-weight:700;letter-spacing:.2px}
    .input,.select{background:var(--card);color:var(--fg);border:1px solid var(--border);border-radius:10px;padding:8px 10px;outline:none}
    .input:focus,.select:focus{border-color:var(--accent)}
    .search{flex:1;min-width:200px}
    .btn{border:none;background:var(--accent);color:white;padding:8px 12px;border-radius:10px;cursor:pointer;font-weight:600}
    .btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--border)}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;box-shadow:var(--shadow)}
    .card h3{margin:0 0 4px}
    .meta{color:var(--muted);font-size:13px;margin-bottom:4px}
    .tags{display:flex;flex-wrap:wrap;gap:4px}
    .chip{background:#eef2ff;padding:2px 8px;border-radius:999px;font-size:12px}
    dialog{border:none;border-radius:12px;padding:0;max-width:760px;width:calc(100% - 24px);background:var(--card);color:var(--fg);box-shadow:var(--shadow)}
    dialog::backdrop{background:rgba(0,0,0,.3)}
    .dialog-hd{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
    .dialog-bd{padding:14px;max-height:70vh;overflow:auto}
    label{font-size:13px;color:var(--muted)}
    input,textarea,select{width:100%;margin-top:4px;padding:8px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--fg)}
    textarea{min-height:80px}
    .list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
    .list li{display:flex;gap:6px}
    .btn.sm{padding:4px 8px;font-size:13px}
    .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .note{font-size:12px;color:var(--muted)}
    @media print{
      header button, header input, header select { display:none !important }
      .card{box-shadow:none}
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">我的食谱本 <small>· 可换背景与字体</small></div>
      <div class="row">
        <input id="q" class="input search" placeholder="搜索标题/标签/配料" />
        <select id="filterCuisine" class="select"><option value="">全部菜系</option></select>
        <button id="newBtn" class="btn">新增食谱</button>
        <button id="exportBtn" class="btn ghost">导出</button>
        <input id="importFile" type="file" accept="application/json" hidden />
        <label for="importFile" class="btn ghost">导入</label>
        <button id="appearanceBtn" class="btn ghost" title="背景与字体">外观</button>
      </div>
    </header>

    <div id="list" class="grid"></div>
    <p id="empty" style="text-align:center;opacity:.6">暂无食谱</p>
  </div>

  <!-- 编辑食谱 -->
  <dialog id="editor">
    <form method="dialog" id="editorForm">
      <div class="dialog-hd"><strong id="dlgTitle">食谱</strong><button value="close" class="btn ghost sm">关闭</button></div>
      <div class="dialog-bd">
        <input type="hidden" id="id" />
        <label>标题<input id="title" type="text" required /></label>
        <label>菜系<input id="cuisine" type="text" /></label>
        <label>难度<select id="difficulty"><option>入门</option><option>日常</option><option>进阶</option></select></label>
        <label>标签<input id="tags" type="text" placeholder="空格分隔" /></label>
        <label>配料<ul id="ingList" class="list"></ul><button id="addIng" type="button" class="btn ghost sm">添加</button></label>
        <label>步骤<ul id="stepList" class="list"></ul><button id="addStep" type="button" class="btn ghost sm">添加</button></label>
        <label>备注<textarea id="notes"></textarea></label>
        <div style="margin-top:10px;display:flex;gap:8px"><button class="btn" id="saveBtn">保存</button><button class="btn ghost" id="delBtn">删除</button></div>
      </div>
    </form>
  </dialog>

  <!-- 查看食谱（只读） -->
  <dialog id="viewer">
    <div class="dialog-hd">
      <strong id="viewTitle">食谱</strong>
      <div class="row">
        <button class="btn ghost sm" id="viewPrint">打印</button>
        <button class="btn ghost sm" value="close" onclick="document.querySelector('#viewer').close()">关闭</button>
      </div>
    </div>
    <div class="dialog-bd" id="viewBody"></div>
  </dialog>

  <!-- 外观设置 -->
  <dialog id="appearance">
    <form method="dialog" id="appearanceForm">
      <div class="dialog-hd">
        <strong>外观设置</strong>
        <div class="row">
          <button class="btn ghost sm" value="close">关闭</button>
        </div>
      </div>
      <div class="dialog-bd">
        <h4>背景</h4>
        <div class="row">
          <label>背景预设
            <select id="bgPreset">
              <option value="paper">米白纸感（默认）</option>
              <option value="mintFabric">淡绿布纹</option>
              <option value="kraft">牛皮纸</option>
              <option value="sunset">日落渐变</option>
              <option value="midnight">夜间墨蓝</option>
              <option value="plain">纯色</option>
            </select>
          </label>
          <label>背景颜色<input id="bgColor" type="color" value="#f6f7fb"/></label>
          <label>背景图片<input id="bgImage" type="file" accept="image/*"/></label>
          <label>铺放方式
            <select id="bgMode">
              <option value="cover">填充（cover）</option>
              <option value="contain">全显（contain）</option>
              <option value="repeat">平铺（repeat）</option>
            </select>
          </label>
          <button id="bgClear" class="btn ghost sm" type="button">清除背景图</button>
        </div>
        <p class="note">提示：可直接选择“背景预设”；若上传图片，将覆盖预设显示。背景图片会以 DataURL 形式保存在本机浏览器中，不会上传。</p>

        <h4 style="margin-top:12px">字体</h4>
        <div class="row" style="align-items:flex-end">
          <label>预设字体
            <select id="fontPreset">
              <option value="system">系统无衬线（默认）</option>
              <option value="sc-sans">苹方 / 思源无衬线栈</option>
              <option value="lxgw-wenkai">霞鹜文楷风格栈</option>
              <option value="sc-serif">宋体 / 思源宋体栈</option>
              <option value="serif">系统衬线</option>
              <option value="mono">等宽（代码风）</option>
            </select>
          </label>
          <label style="flex:1">自定义字体栈
            <input id="fontStack" type="text" placeholder="例如：'LXGW WenKai', 'Source Han Serif SC', serif" />
          </label>
        </div>
        <div class="row">
          <label>上传字体文件（可选）<input id="fontFile" type="file" accept=".ttf,.otf,.woff,.woff2"/></label>
          <button id="fontClear" class="btn ghost sm" type="button">移除自定义字体文件</button>
        </div>
        <p class="note">若上传字体文件，将以 DataURL 形式嵌入并本地保存；仅此浏览器可用。</p>

        <div style="margin-top:12px" class="row">
          <button id="appearanceSave" class="btn">保存外观</button>
          <button id="appearanceReset" type="button" class="btn ghost">恢复默认</button>
        </div>
      </div>
    </form>
  </dialog>

  <script>
  const $ = s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
  const storeKey='recipes_noimg';
  const prefKey='recipes_prefs_v1';
  let recipes=load();
  let prefs = loadPrefs();
  applyPrefs();
  render();

  // 顶部按钮
  $('#newBtn').onclick=()=>openEditor();
  $('#exportBtn').onclick=exportJSON;
  $('#importFile').onchange=importJSON;
  $('#q').oninput=()=>render($('#q').value.trim());
  $('#appearanceBtn').onclick=()=>openAppearance();

  function load(){try{return JSON.parse(localStorage.getItem(storeKey)||'[]')}catch(e){return []}}
  function save(){localStorage.setItem(storeKey,JSON.stringify(recipes))}

  function loadPrefs(){ try{ return JSON.parse(localStorage.getItem(prefKey) || '{}'); }catch(e){return {}} }
  function savePrefs(){ localStorage.setItem(prefKey, JSON.stringify(prefs)) }

  function applyPrefs(){
    // 背景颜色
    document.body.style.backgroundColor = prefs.bgColor || getComputedStyle(document.documentElement).getPropertyValue('--bg');

    // 背景预设（若没有自定义图片时生效）
    if (!prefs.bgImage){
      applyBgPreset(prefs.bgPreset || 'paper');
    }

    // 背景图片（优先级更高，覆盖预设）
    if (prefs.bgImage){
      document.body.style.backgroundImage = `url(${prefs.bgImage})`;
      if (prefs.bgMode === 'repeat'){
        document.body.style.backgroundRepeat = 'repeat';
        document.body.style.backgroundSize = 'auto';
        document.body.style.backgroundPosition = 'top left';
      } else if (prefs.bgMode === 'contain'){
        document.body.style.backgroundRepeat = 'no-repeat';
        document.body.style.backgroundSize = 'contain';
        document.body.style.backgroundPosition = 'center top';
      } else { // cover
        document.body.style.backgroundRepeat = 'no-repeat';
        document.body.style.backgroundSize = 'cover';
        document.body.style.backgroundPosition = 'center center';
      }
    }

    // 字体：自定义字体文件优先
    const styleId = 'custom-font-style';
    let styleEl = document.getElementById(styleId);
    if (!styleEl){ styleEl = document.createElement('style'); styleEl.id = styleId; document.head.appendChild(styleEl); }
    styleEl.textContent = '';
    let fontStack = '';

    if (prefs.fontFileData && prefs.fontFamily){
      styleEl.textContent = `@font-face{ font-family: "${cssEscape(prefs.fontFamily)}"; src: url(${prefs.fontFileData}); font-display: swap; }`;
      fontStack = `"${prefs.fontFamily}", `;
    }

    if (prefs.fontStack && prefs.fontStack.trim()){
      fontStack += prefs.fontStack.trim();
    } else {
      const preset = prefs.fontPreset || 'system';
      switch(preset){
        case 'sc-sans':
          fontStack += `'PingFang SC', 'HarmonyOS Sans SC', 'Source Han Sans SC', 'Noto Sans CJK SC', 'Microsoft YaHei', system-ui, -apple-system, Segoe UI, Roboto, sans-serif`;
          break;
        case 'lxgw-wenkai':
          fontStack += `'LXGW WenKai Screen', 'LXGW WenKai', '霞鹜文楷', 'Kaiti SC', 'STKaiti', 'KaiTi', 'Source Han Serif SC', serif`;
          break;
        case 'sc-serif':
          fontStack += `'Source Han Serif SC', 'Noto Serif CJK SC', 'Songti SC', 'SimSun', 'PMingLiU', serif`;
          break;
        case 'serif':
          fontStack += 'serif';
          break;
        case 'mono':
          fontStack += 'ui-monospace, Menlo, Monaco, Consolas, "SFMono-Regular", monospace';
          break;
        default:
          fontStack += 'system-ui, -apple-system, Segoe UI, Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif';
      }
    }
    document.documentElement.style.setProperty('--app-font', fontStack);
  }

  function render(q=''){
    const list=$('#list'),emp=$('#empty');
    const keyword = (q || $('#q').value.trim() || '').toLowerCase();
    const f=recipes.filter(r=>{
      if (!keyword) return true;
      const hay=[r.title,(r.tags||[]).join(' '),(r.ingredients||[]).join(' '),(r.steps||[]).join(' '),(r.notes||''),(r.cuisine||''),(r.difficulty||'')].join(' ').toLowerCase();
      return hay.includes(keyword);
    });
    emp.style.display=f.length?'none':'block';
    list.innerHTML=f.map(r=>`<div class='card'>
      <h3><a href='#' onclick='openViewerById("${r.id}");return false;'>${escapeHTML(r.title)}</a></h3>
      <div class='meta'>${escapeHTML(r.cuisine||'')} · ${escapeHTML(r.difficulty||'')}</div>
      <div class='tags'>${(r.tags||[]).map(t=>`<span class='chip'>#${escapeHTML(t)}</span>`).join('')}</div>
      <div style='margin-top:6px;display:flex;gap:6px'>
        <button class='btn ghost sm' onclick='openEditor(${JSON.stringify(r)})'>编辑</button>
        <button class='btn ghost sm' onclick='del("${r.id}")'>删除</button>
      </div>
    </div>`).join('')
  }

  function openEditor(r){
    const d=$('#editor');d.showModal();
    $('#editorForm').reset();
    $('#id').value=r?.id||'';
    $('#title').value=r?.title||'';
    $('#cuisine').value=r?.cuisine||'';
    $('#difficulty').value=r?.difficulty||'日常';
    $('#tags').value=(r?.tags||[]).join(' ');
    $('#notes').value=r?.notes||'';
    $('#ingList').innerHTML='';(r?.ingredients||['']).forEach(v=>addRow($('#ingList'),v));
    $('#stepList').innerHTML='';(r?.steps||['']).forEach(v=>addRow($('#stepList'),v));
    $('#addIng').onclick=()=>addRow($('#ingList'));
    $('#addStep').onclick=()=>addRow($('#stepList'));
    $('#saveBtn').onclick=e=>{e.preventDefault();saveForm()};
    $('#delBtn').onclick=e=>{e.preventDefault();del($('#id').value)};
  }

  function addRow(ul,val=''){const li=document.createElement('li');li.innerHTML=`<input type='text' value='${escapeHTML(val)}'/><button class='btn ghost sm'>删</button>`;li.querySelector('button').onclick=()=>li.remove();ul.append(li)}

  function saveForm(){
    const id=$('#id').value||'r_'+Math.random().toString(36).slice(2,8);
    const r={id,title:$('#title').value.trim(),cuisine:$('#cuisine').value.trim(),difficulty:$('#difficulty').value,tags:$('#tags').value.split(/\s+/).filter(Boolean),ingredients:$$('#ingList input').map(i=>i.value.trim()).filter(Boolean),steps:$$('#stepList input').map(i=>i.value.trim()).filter(Boolean),notes:$('#notes').value.trim()};
    if(!r.title)return alert('请输入标题');
    const i=recipes.findIndex(x=>x.id===id);if(i>=0)recipes[i]=r;else recipes.unshift(r);
    save();$('#editor').close();render();
  }

  function del(id){if(!id)return;recipes=recipes.filter(r=>r.id!==id);save();render();$('#editor').close();}

  function exportJSON(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(recipes,null,2)],{type:'application/json'}));a.download='recipes.json';a.click()}
  function importJSON(e){const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const arr=JSON.parse(rd.result);if(Array.isArray(arr)){recipes=arr;save();render();}}catch(err){alert('导入失败')}};rd.readAsText(f)}

  // 外观设置逻辑
  function openAppearance(){
    const d=$('#appearance');
    // 预填
    $('#bgPreset').value = prefs.bgPreset || 'paper';
    $('#bgColor').value = prefs.bgColor || '#f6f7fb';
    $('#bgMode').value = prefs.bgMode || 'cover';
    $('#fontPreset').value = prefs.fontPreset || 'system';
    $('#fontStack').value = prefs.fontStack || '';
    $('#bgImage').value = '';
    $('#fontFile').value = '';

    $('#bgClear').onclick = ()=>{ prefs.bgImage=''; applyPrefs(); savePrefs(); alert('已清除背景图'); };
    $('#fontClear').onclick = ()=>{ prefs.fontFileData=''; prefs.fontFamily=''; applyPrefs(); savePrefs(); alert('已移除自定义字体文件'); };

    $('#appearanceSave').onclick = (e)=>{
      e.preventDefault();
      prefs.bgPreset = $('#bgPreset').value;
      prefs.bgColor = $('#bgColor').value;
      prefs.bgMode = $('#bgMode').value;
      prefs.fontPreset = $('#fontPreset').value;
      prefs.fontStack = $('#fontStack').value;
      // 文件读取（若选择）
      const bgf = $('#bgImage').files[0];
      const ff = $('#fontFile').files[0];
      const tasks = [];
      if (bgf){ tasks.push(fileToDataURL(bgf).then(u=>{ prefs.bgImage=u; })) } else { prefs.bgImage = prefs.bgImage || ''; }
      if (ff){ tasks.push(fileToDataURL(ff).then(u=>{ prefs.fontFileData=u; prefs.fontFamily = ff.name.replace(/\.(ttf|otf|woff2?|TTF|OTF|WOFF2?)$/, ''); })) }
      Promise.all(tasks).then(()=>{ savePrefs(); applyPrefs(); d.close(); });
    };

    $('#appearanceReset').onclick = ()=>{
      prefs = {};
      savePrefs(); applyPrefs();
      // 重置表单可见值
      $('#bgPreset').value = 'paper';
      $('#bgColor').value = '#f6f7fb';
      $('#bgMode').value = 'cover';
      $('#fontPreset').value = 'system';
      $('#fontStack').value = '';
      alert('已恢复默认');
    };

    d.showModal();
  }

  function fileToDataURL(file){
    return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); })
  }

  // 查看食谱（只读）
  function openViewer(r){
    const d = document.querySelector('#viewer');
    document.querySelector('#viewTitle').textContent = r.title || '食谱';
    const tagHTML = (r.tags||[]).map(t=>`<span class="chip">#${escapeHTML(t)}</span>`).join(' ');
    const makeList = arr => (arr||[]).map(x=>`<li>${escapeHTML(x)}</li>`).join('');
    document.querySelector('#viewBody').innerHTML = `
      <p class="meta">${escapeHTML(r.cuisine||'')} · ${escapeHTML(r.difficulty||'')}</p>
      ${tagHTML?`<div class="tags" style="margin-bottom:6px">${tagHTML}</div>`:''}
      ${r.ingredients&&r.ingredients.length?`<h4>配料</h4><ul>${makeList(r.ingredients)}</ul>`:''}
      ${r.steps&&r.steps.length?`<h4>步骤</h4><ol>${makeList(r.steps)}</ol>`:''}
      ${r.notes?`<h4>备注</h4><p>${escapeHTML(r.notes)}</p>`:''}
    `;
    document.querySelector('#viewPrint').onclick = ()=> window.print();
    d.showModal();
  }
  function openViewerById(id){ const r = (recipes||[]).find(x=>x.id===id); if(r) openViewer(r); }

  // 背景预设渲染
  function applyBgPreset(preset){
    switch(preset){
      case 'paper':
        document.body.style.backgroundImage = `${paperTexture()}`;
        document.body.style.backgroundRepeat = 'repeat, no-repeat';
        document.body.style.backgroundSize = 'auto, cover';
        document.body.style.backgroundPosition = 'top left, center center';
        break;
      case 'mintFabric':
        document.body.style.backgroundImage = `${fabricTexture('#f4fbf7')}`;
        document.body.style.backgroundRepeat = 'repeat';
        document.body.style.backgroundSize = 'auto';
        document.body.style.backgroundPosition = 'top left';
        break;
      case 'kraft':
        document.body.style.backgroundImage = `${kraftTexture()}`;
        document.body.style.backgroundRepeat = 'repeat';
        document.body.style.backgroundSize = 'auto';
        document.body.style.backgroundPosition = 'top left';
        break;
      case 'sunset':
        document.body.style.backgroundImage = 'linear-gradient(180deg, #ffe8d6 0%, #ffd1dc 50%, #e0e7ff 100%)';
        document.body.style.backgroundRepeat = 'no-repeat';
        document.body.style.backgroundSize = 'cover';
        document.body.style.backgroundPosition = 'center center';
        break;
      case 'midnight':
        document.body.style.backgroundImage = 'linear-gradient(180deg, #0f172a 0%, #111827 100%)';
        document.body.style.backgroundRepeat = 'no-repeat';
        document.body.style.backgroundSize = 'cover';
        document.body.style.backgroundPosition = 'center center';
        break;
      default: // plain
        document.body.style.backgroundImage = 'none';
        document.body.style.backgroundRepeat = 'no-repeat';
        document.body.style.backgroundSize = 'auto';
        document.body.style.backgroundPosition = 'center center';
    }
  }

  // 生成一些轻量纹理（纯 CSS 渐变）
  function paperTexture(){
    const grid = 'repeating-linear-gradient(0deg, rgba(0,0,0,0.02) 0 1px, transparent 1px 8px), repeating-linear-gradient(90deg, rgba(0,0,0,0.015) 0 1px, transparent 1px 8px)';
    const base = 'linear-gradient(180deg, #faf7f1 0%, #f5f2eb 100%)';
    return `${grid}, ${base}`;
  }
  function fabricTexture(bg='#f6f7fb'){
    const weave = 'repeating-linear-gradient(45deg, rgba(0,0,0,0.025) 0 2px, transparent 2px 4px), repeating-linear-gradient(-45deg, rgba(0,0,0,0.02) 0 2px, transparent 2px 4px)';
    const base = `linear-gradient(${bg}, ${bg})`;
    return `${weave}, ${base}`;
  }
  function kraftTexture(){
    const dots = 'radial-gradient(rgba(0,0,0,0.06) 1px, transparent 1px)';
    const base = 'linear-gradient(#f1e3c6, #e9d5b4)';
    return `${dots}, ${base}`;
  }

  function escapeHTML(s=''){ return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c])) }
  function cssEscape(s=''){ return s.replace(/"/g,'\\"') }

  // 首次给出两个示例（便于上手）
  if (!recipes.length){
    recipes = [
